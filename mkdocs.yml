site_name: ChunkReg
site_description: Chunked co-registration of 3D volumes too large for one GPU (OME-Zarr, anatomix features, FireANTs).
repo_url: https://github.com/BRIDGE-Neuroscience/ChunkReg
repo_name: BRIDGE-Neuroscience/ChunkReg
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - search.highlight

nav:
  - Home: index.md
  - Concepts: concepts.md
  - Configuration: configuration.md
  - Large scans: large-scans.md
  - Running: running.md
  - Outputs and QC: outputs-qc.md
  - Reference:
      - Command line: cli.md
      - Python API: api.md
  - Design notes: PLAN.md

# Working notes and the requirements file are not pages.
exclude_docs: |
  PLAN_*.md
  requirements.txt

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
