[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chunkreg"
version = "0.1.0"
description = "Hierarchical chunked co-registration of N massive volumes, anatomix-backed"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Production storage backend. Required for any real run.
store = ["zarr>=3.0", "numcodecs>=0.13"]
# Ingest/export of foreign formats.
io = ["tifffile>=2024.1", "nibabel>=5.0"]
# GPU registration path.
gpu = ["torch>=2.1", "monai>=1.3", "SimpleITK>=2.3"]
# QC tables.
qc = ["pyarrow>=14.0"]
# Feature sheets and QC thumbnails.
viz = ["Pillow>=10.0"]
dev = ["pytest>=7.0"]

[project.scripts]
chunkreg = "chunkreg.cli:main"

[tool.setuptools.packages.find]
include = ["chunkreg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]
